[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voai-ghostapi"
version = "0.1.0"
description = "Offline-first HAR to FastAPI mock generator"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
dependencies = ["typer>=0.12", "rich>=13", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx>=0.27,<1", "ruff", "mypy", "coverage", "build"]
browser = ["playwright>=1.40"]

[project.scripts]
voai-ghostapi = "voai_ghostapi.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/voai_ghostapi"]

[tool.hatch.build]
exclude = [
  "/.venv-new/",
  "/.pytest-tmp/",
  "/temp/",
  "/*-temp/",
  "/tmpgen/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: opt-in tests that access an authorized live website",
]

