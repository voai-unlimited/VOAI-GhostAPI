name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest --cov=voai_ghostapi --cov-report=term-missing
      - run: python -m build
      - run: python -m venv .wheel-smoke
      - name: Install wheel in clean environment (Windows)
        if: runner.os == 'Windows'
        run: .wheel-smoke\Scripts\python -m pip install (Get-ChildItem dist\*.whl)
        shell: pwsh
      - name: Install wheel in clean environment (Unix)
        if: runner.os != 'Windows'
        run: .wheel-smoke/bin/python -m pip install dist/*.whl
      - name: Smoke test clean wheel (Windows)
        if: runner.os == 'Windows'
        run: |
          .wheel-smoke\Scripts\voai-ghostapi.exe --help
          .wheel-smoke\Scripts\voai-ghostapi.exe --version
        shell: pwsh
      - name: Smoke test clean wheel (Unix)
        if: runner.os != 'Windows'
        run: |
          .wheel-smoke/bin/voai-ghostapi --help
          .wheel-smoke/bin/voai-ghostapi --version
